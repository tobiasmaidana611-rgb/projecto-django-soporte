<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reparación - Gestor Técnico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 0;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #38bdf8;
            font-size: 1.35rem;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 6px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            color: #f1f5f9;
            background-color: #334155;
        }

        /* Content */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 25px;
        }

        header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
        }

        header h1 {
            font-size: 1.7rem;
            color: #f8fafc;
            margin-top: 10px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .botones {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button, .btn-cancelar {
            padding: 11px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }

        .btn-guardar {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .btn-guardar:hover {
            background-color: #7dd3fc;
        }

        .btn-cancelar {
            background-color: #334155;
            color: #e2e8f0;
        }

        .btn-cancelar:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="{% url 'inicio' %}" class="logo">Gestor Técnico</a>
            <div class="nav-links">
                <a href="{% url 'inicio' %}">Inicio</a>
                <a href="{% url 'lista_reparaciones' %}">Reparaciones</a>
                <a href="#">Técnicos</a>
                <a href="/admin/">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header>
            <a href="{% url 'lista_reparaciones' %}">← Volver al listado</a>
            <h1>Editar Reparación</h1>
        </header>

        <div class="card">
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Técnico</label>
                    <input type="text" name="tecnico" value="{{ reparacion.tecnico }}" required>
                </div>

                <div class="form-group">
                    <label>Diagnóstico</label>
                    <textarea name="diagnostico">{{ reparacion.diagnostico }}</textarea>
                </div>

                <div class="form-group">
                    <label>Estado</label>
                    <select name="estado">
                        <option value="ESPERA" {% if reparacion.estado == "ESPERA" %}selected{% endif %}>En espera</option>
                        <option value="REPARANDO" {% if reparacion.estado == "REPARANDO" %}selected{% endif %}>En reparación</option>
                        <option value="FINALIZADO" {% if reparacion.estado == "FINALIZADO" %}selected{% endif %}>Finalizado</option>
                        <option value="ENTREGADO" {% if reparacion.estado == "ENTREGADO" %}selected{% endif %}>Entregado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Fecha de entrega</label>
                    <input type="date" name="fecha_entrega" value="{{ reparacion.fecha_entrega|date:'Y-m-d' }}">
                </div>

                <div class="form-group">
                    <label>Solución</label>
                    <textarea name="solucion">{{ reparacion.solucion }}</textarea>
                </div>

                <div class="botones">
                    <button type="submit" class="btn-guardar">Guardar cambios</button>
                    <a href="{% url 'lista_reparaciones' %}" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
